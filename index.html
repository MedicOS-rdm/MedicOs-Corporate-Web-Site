<style>
/* ============================================================
   MedicOs — Hoja de estilos compartida
   Paleta tomada del isotipo oficial (azul clínico + tinta marina)
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420;9..144,520;9..144,600;9..144,680&family=Manrope:wght@400;500;600;700;800&display=swap');

:root{
  /* Paleta — extraída directamente del logo MedicOs */
  --navy: #0a2d59;        /* tinta del cabello / corbata en el logo */
  --navy-deep: #071f3f;
  --blue: #1a63c4;        /* azul del aro del logo */
  --blue-bright: #0a5fe0;  /* azul de la carpeta del logo */
  --sky: #eaf2fd;
  --sky-soft: #f4f8fd;
  --paper: #fbfdff;
  --ink: #0f2138;
  --muted: #5c7292;
  --line: #dde7f4;
  --white: #ffffff;
  --amber: #e2a63a; /* acento cálido puntual, uso mínimo */

  --font-display: "Fraunces", "Iowan Old Style", serif;
  --font-body: "Manrope", "Segoe UI", sans-serif;

  --shadow-soft: 0 18px 40px -22px rgba(10, 45, 89, 0.35);
  --shadow-card: 0 12px 30px -18px rgba(10, 45, 89, 0.28);

  --radius-lg: 22px;
  --radius-md: 14px;
  --radius-sm: 8px;
}

*, *::before, *::after{ box-sizing: border-box; }

html{ scroll-behavior: smooth; }

body{
  margin: 0;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  line-height: 1.55;
}

img{ max-width: 100%; display: block; }

a{ color: inherit; text-decoration: none; }

h1, h2, h3, h4{
  font-family: var(--font-display);
  color: var(--navy);
  margin: 0 0 0.5em;
  line-height: 1.12;
  font-weight: 600;
  letter-spacing: -0.01em;
}

p{ margin: 0 0 1em; color: var(--muted); max-width: 62ch; }

.container{
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 32px;
}

@media (max-width: 640px){
  .container{ padding: 0 20px; }
}

/* ---------- Foco visible / accesibilidad ---------- */
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
  outline: 3px solid var(--blue-bright);
  outline-offset: 3px;
  border-radius: 4px;
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ============================================================
   Encabezado / navegación (páginas interiores)
   ============================================================ */
.site-header{
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(251, 253, 255, 0.86);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}

.nav{
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0;
}

.brand{
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand img{ height: 42px; width: 42px; border-radius: 50%; }

.brand-word{
  font-family: var(--font-display);
  font-size: 1.32rem;
  font-weight: 600;
  color: var(--navy);
}
.brand-word span{ color: var(--blue-bright); }

.brand-tag{
  display: block;
  font-family: var(--font-body);
  font-size: 0.68rem;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 0.02em;
}

.nav-links{
  display: flex;
  align-items: center;
  gap: 6px;
  list-style: none;
  margin: 0;
  padding: 0;
}

.nav-links a{
  display: inline-block;
  padding: 9px 16px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--navy);
  transition: background 0.2s ease, color 0.2s ease;
}

.nav-links a:hover{ background: var(--sky); }

.nav-links a.active{
  background: var(--navy);
  color: var(--white);
}

.nav-cta{
  margin-left: 8px;
  background: var(--blue-bright);
  color: var(--white) !important;
  padding: 10px 20px !important;
  box-shadow: var(--shadow-card);
}
.nav-cta:hover{ background: var(--navy); }

.nav-toggle{
  display: none;
  background: none;
  border: 1px solid var(--line);
  border-radius: 10px;
  width: 42px;
  height: 42px;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.nav-toggle svg{ width: 20px; height: 20px; }

@media (max-width: 860px){
  .nav-toggle{ display: inline-flex; }
  .nav-links{
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    flex-direction: column;
    align-items: stretch;
    background: var(--white);
    border-bottom: 1px solid var(--line);
    padding: 10px 20px 18px;
    gap: 2px;
    display: none;
  }
  .nav-links.open{ display: flex; }
  .nav-links a{ padding: 12px 14px; }
  .nav-cta{ margin-left: 0; text-align: center; }
}

/* ============================================================
   Botones
   ============================================================ */
.btn{
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 13px 26px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.98rem;
  border: 1px solid transparent;
  cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, color .18s ease;
}
.btn:hover{ transform: translateY(-2px); }

.btn-primary{
  background: var(--blue-bright);
  color: var(--white);
  box-shadow: var(--shadow-card);
}
.btn-primary:hover{ background: var(--navy); }

.btn-ghost{
  background: transparent;
  border-color: var(--line);
  color: var(--navy);
}
.btn-ghost:hover{ border-color: var(--blue); background: var(--sky); }

.btn-light{
  background: var(--white);
  color: var(--navy);
}
.btn-light:hover{ background: var(--sky); }

/* ============================================================
   Secciones genéricas
   ============================================================ */
section{ padding: 88px 0; }
@media (max-width: 700px){ section{ padding: 60px 0; } }

.eyebrow-line{
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--blue-bright);
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 14px;
}
.eyebrow-line .pulse-dot{
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--blue-bright);
  box-shadow: 0 0 0 0 rgba(10,95,224,0.5);
  animation: pulseDot 2.2s infinite;
}
@keyframes pulseDot{
  0%{ box-shadow: 0 0 0 0 rgba(10,95,224,0.45); }
  70%{ box-shadow: 0 0 0 9px rgba(10,95,224,0); }
  100%{ box-shadow: 0 0 0 0 rgba(10,95,224,0); }
}

.section-head{ max-width: 640px; margin-bottom: 48px; }
.section-head h2{ font-size: clamp(1.8rem, 3vw, 2.4rem); }

/* ============================================================
   Tarjetas de módulos (grid)
   ============================================================ */
.grid{
  display: grid;
  gap: 22px;
}
.grid-3{ grid-template-columns: repeat(3, 1fr); }
.grid-2{ grid-template-columns: repeat(2, 1fr); }
@media (max-width: 860px){
  .grid-3, .grid-2{ grid-template-columns: 1fr; }
}

.module-card{
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 30px 26px;
  position: relative;
  overflow: hidden;
}
.module-card::before{
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: var(--blue-bright);
}
.module-card h3{ font-size: 1.15rem; margin-bottom: 10px; }
.module-card p{ margin: 0; font-size: 0.95rem; }
.module-icon{
  width: 46px; height: 46px;
  border-radius: 12px;
  background: var(--sky);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
  color: var(--blue-bright);
}
.module-icon svg{ width: 24px; height: 24px; }

/* ============================================================
   EKG — línea decorativa de electrocardiograma (motivo de marca)
   ============================================================ */
.ekg-line{ width: 100%; display: block; overflow: visible; }
.ekg-path{
  fill: none;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ============================================================
   Footer
   ============================================================ */
.site-footer{
  background: var(--navy-deep);
  color: #cddcf0;
  padding: 56px 0 0;
}
.footer-top{
  display: grid;
  grid-template-columns: 1.3fr 1fr 1fr;
  gap: 40px;
  padding-bottom: 44px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
}
@media (max-width: 760px){
  .footer-top{ grid-template-columns: 1fr; }
}
.footer-brand{ display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.footer-brand img{ height: 40px; width: 40px; border-radius: 50%; }
.footer-brand-word{ font-family: var(--font-display); font-size: 1.2rem; color: var(--white); font-weight: 600; }
.site-footer p{ color: #a9bcd8; font-size: 0.92rem; }
.footer-col h4{ color: var(--white); font-family: var(--font-body); font-size: 0.85rem; letter-spacing: 0.04em; margin-bottom: 14px; }
.footer-col ul{ list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.footer-col a{ color: #c3d3ea; font-size: 0.94rem; transition: color 0.2s ease; }
.footer-col a:hover{ color: var(--white); }

.footer-credit{
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  padding: 22px 0;
  font-size: 0.85rem;
  color: #91a6c6;

  transition: transform 0.2s ease, box-shadow 0.2s ease;

.iwa-link:hover{ transform: translateY(-2px); box-shadow: 0 10px 24px -12px rgba(0,0,0,0.5); }
.iwa-link img{ height: 26px; width: auto; border-radius: 50%; background: var(--white); }
.iwa-link span{ color: var(--navy); font-weight: 700; font-size: 0.82rem; }
